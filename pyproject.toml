[project]
name = "structselect"
version = "0.1.0"
description = "Structured column selection for orthogonal-row RRQR/CSSP"
readme = "APPLICATION.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy>=1.24", "scipy>=1.10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["structselect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
