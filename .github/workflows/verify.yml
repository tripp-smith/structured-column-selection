name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true

      - name: Lean hygiene
        run: python3 scripts/check_lean_hygiene.py

      - name: Axiom audit
        run: bash scripts/check_axioms.sh

      - name: Public expected-type contracts
        run: lake env lean scripts/CompletionContract.lean

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Pytest
        run: .venv/bin/python -m pytest
